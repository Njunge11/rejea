# The database for local development. The Go service runs on the host.
name: rejea

services:
  postgres:
    build: docker/postgres
    environment:
      POSTGRES_USER: rejea
      POSTGRES_PASSWORD: rejea
      POSTGRES_DB: rejea
    ports:
      # Host port 5433: a PostgreSQL on the host can keep 5432.
      - "127.0.0.1:5433:5432"
    volumes:
      # This path is for PostgreSQL 17. From version 18 the image keeps its
      # data in /var/lib/postgresql.
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rejea -d rejea"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
