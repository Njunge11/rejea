<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 856" width="960" height="856" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Architecture of Rejea. Ingestion: the client gets an upload URL from the HTTP API and sends the file to the file store. Three workers, each with its own job queue, hash the file, turn it into blocks with the parser, and make chunks with vectors from the embedding model, saved in PostgreSQL. Search: the question becomes a vector, PostgreSQL runs a keyword search and a vector search, and an optional reranker orders the results."><defs><pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="0.75" fill="#dedee3"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2,1.5 L8,5 L2,8.5" fill="none" stroke="#b4b4bb" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker><filter id="lift" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#18181b" flood-opacity="0.05"/></filter></defs><rect y="0" width="960" height="856" fill="#ffffff"/>
